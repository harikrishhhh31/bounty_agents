[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bugbounty"
version = "0.1.0"
description = "Unified security research and bug bounty platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "typer>=0.12",
  "python-dotenv>=1.0",
  "rich>=13.0",
  "PyYAML>=6.0",
]

[project.scripts]
bugbounty = "bugbounty.cli:main"

[tool.setuptools.packages.find]
include = ["bugbounty*"]

[tool.pytest.ini_options]
pythonpath = ["."]

testpaths = ["tests"]
